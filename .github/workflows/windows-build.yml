name: Windows build (bb-probe.exe)

on:
  push:
    branches: [vram-gc-diagnostics]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build
        # The current MSYS2 libc++ no longer includes <new>, <cmath>, <cstdlib>... transitively;
        # fsr-vulkan, sirit and others relied on that (and on stdlib.h/wchar.h for _countof and
        # swprintf_s). Force the common headers instead of patching every third-party file.
        env:
          CXXFLAGS: >-
            -include stdlib.h -include wchar.h
            -include cstdlib -include cstdio -include cstring -include cwchar -include cmath
            -include cstdint -include new -include limits -include utility -include algorithm
            -include memory -include string -include functional -include iterator
        run: |
          if ! bash build.sh > build-all.log 2>&1; then
            # Keep going past the first failure so that one run reports every error.
            ninja -C out/gpu -k 0 bb-probe > keep-going.log 2>&1 || true
            # Job logs need a login; annotations do not: put the errors in one.
            {
              tail -15 build-all.log
              echo '--- compiler errors ---'
              grep -E -B1 -A3 'error:|undefined (reference|symbol)' keep-going.log | head -200
            } > errors.txt
            cat errors.txt
            msg=$(tr -d '\r' < errors.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Collect bb-probe.exe and the DLLs not already installed
        run: |
          mkdir -p dist/bb-probe dist/dlls
          llvm-strip --strip-debug -o dist/bb-probe/bb-probe.exe out/bb-probe.exe
          ldd out/bb-probe.exe | awk '/\/clang64\/bin\// {print $3}' | sort -u > dist/needed.txt
          echo "DLLs from MSYS2 needed by bb-probe.exe:"
          cat dist/needed.txt
          # The toolchain runtime has no version in its name: always ship it (backward compatible).
          for dll in libc++.dll libunwind.dll libwinpthread-1.dll; do
            cp /clang64/bin/$dll dist/bb-probe/
          done
          missing=0
          while read -r dll; do
            name=$(basename "$dll" | tr 'A-Z' 'a-z')
            if ! grep -qx "$name" .github/installed-dlls.txt; then
              echo "NOT INSTALLED: $name"
              cp "$dll" dist/dlls/
              missing=$((missing + 1))
            fi
          done < dist/needed.txt
          echo "DLLs missing from the installed bin folder: $missing"
          cp dist/needed.txt dist/bb-probe/
          git log -1 --format='%H %s' > dist/bb-probe/commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bb-probe
          path: dist/bb-probe

      - uses: actions/upload-artifact@v4
        with:
          name: missing-dlls
          path: dist/dlls
          if-no-files-found: ignore
